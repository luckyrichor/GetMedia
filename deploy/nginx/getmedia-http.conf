# GetMedia — http 级配置
# 安装位置：/etc/nginx/conf.d/getmedia-http.conf
# 前提：/etc/nginx/nginx.conf 的 http 块里有  include /etc/nginx/conf.d/*.conf;
#
# 约定
#   * 本文件里所有变量、zone、log_format 的名字都以 gm_ / getmedia 开头，不与同机其他项目冲突。
#   * 这里不设置任何"全局生效"的指令（例如 limit_req_status、client_max_body_size），
#     否则会改变同机其他项目的行为；这类设置都写在 getmedia-prefix.conf 的 location 里。

# ---- 1) 免费接口白名单 --------------------------------------------------------------
# 键 = "方法 + 规范化后的路径($uri)"，整串锚定的正则；不在表里的一律 404（见 getmedia-prefix.conf）。
# 用正则键而不是字面键：字面键进哈希表，键一长就要调大全局指令 map_hash_bucket_size，
# 而该指令在 http 级只能设一次——同机其他项目若也设了会让整个 nginx 配置失败，所以不碰它。
# 必须与 server/getmedia/tiers.py 的 FREE_ROUTES 逐条一致（tools/tests/test_deploy_templates.py 会校验）。
# {device_id} 的格式是 dev_ + 16 位小写十六进制。
map "$request_method $uri" $gm_api_allowed {
    default 0;
    "~^GET /getmedia/api/health$"                         1;
    "~^GET /getmedia/api/v2/config$"                      1;
    "~^GET /getmedia/api/v2/legal$"                       1;
    "~^POST /getmedia/api/v2/heartbeat$"                  1;
    "~^POST /getmedia/api/v2/feedback$"                   1;
    "~^POST /getmedia/api/account/register$"              1;
    "~^POST /getmedia/api/account/login$"                 1;
    "~^POST /getmedia/api/account/logout$"                1;
    "~^GET /getmedia/api/account/me$"                     1;
    "~^DELETE /getmedia/api/account/me$"                  1;
    "~^POST /getmedia/api/account/consent$"               1;
    "~^POST /getmedia/api/account/recovery/ack$"          1;
    "~^GET /getmedia/api/account/devices$"                1;
    "~^POST /getmedia/api/account/devices/revoke-others$" 1;
    "~^POST /getmedia/api/account/password$"              1;
    "~^POST /getmedia/api/account/recover$"               1;
    "~^DELETE /getmedia/api/account/devices/dev_[0-9a-f]{16}$" 1;
}

# ---- 2) 限流 -----------------------------------------------------------------------
# 应用内另有按 IP / 登录名 / 账号的落库限流（重启不丢）；这里是挡在应用前面的粗粒度一层。
# 认证类接口的限流键：只对注册/登录/找回有值；键为空时 nginx 不计数。
map $uri $gm_auth_key {
    default "";
    "~^/getmedia/api/account/(register|login|recover)$" $binary_remote_addr;
}
limit_req_zone $gm_auth_key        zone=gm_auth:10m     rate=30r/m;
limit_req_zone $binary_remote_addr zone=gm_feedback:10m rate=6r/m;
limit_req_zone $binary_remote_addr zone=gm_api:10m      rate=20r/s;

# 备用 APK 直链：每 IP 同时 1 个连接；全站同时下载数上限见 getmedia-prefix.conf。
limit_conn_zone $binary_remote_addr zone=gm_dl_ip:10m;
limit_conn_zone $server_name        zone=gm_dl_all:1m;

# ---- 3) 访问日志格式 ---------------------------------------------------------------
# 只记 IP、时间、方法、路径（不含查询串）、状态码、字节数、耗时、UA。
# 显式不含：Cookie、Authorization、X-GetMedia-Session、Referer、完整请求行（含查询串）。
map $request_uri $gm_log_path {
    default $request_uri;
    "~^(?<p>[^?]*)" $p;
}
log_format getmedia '$remote_addr [$time_iso8601] "$request_method $gm_log_path" '
                    '$status $body_bytes_sent $request_time "$http_user_agent"';
