# GetMedia — /getmedia/ 前缀下的全部路由
# 安装位置：/etc/nginx/snippets/getmedia-prefix.conf
# 用法：在 443 的 server 块里、既有 include 之后加这一行（只此一行）：
#           include /etc/nginx/snippets/getmedia-prefix.conf;
# 回退：删除那一行并 reload（nginx -t 通过后），GetAudio、GetVideo 等其他项目不受影响。
#
# 依赖 getmedia-http.conf（http 级）里的 map / zone / log_format。
# 路径占位：
#   /var/www/getmedia/public/    网页静态文件（web-public 构建产物，放在仓库之外）
#   /var/www/getmedia/download/  APK 备用直链目录
#   /var/log/nginx/getmedia.access.log  专用访问日志（logrotate 见 deploy/logrotate/getmedia）
#   127.0.0.1:8700               getmedia-api（须与 GETMEDIA_BIND、getmedia-api.service 一致）
#
# 不开 CORS（同源）。add_header 不继承，所以安全头在每个 location 里各写一份。

# ---- /getmedia → /getmedia/ ---------------------------------------------------------
location = /getmedia {
    return 308 /getmedia/;
}

# ---- 反馈接口：允许大请求体（图片），单独限流 -------------------------------------
# 精确匹配优先于下面的 ^~ 前缀匹配。方法与路径是否允许仍由 $gm_api_allowed 判定。
location = /getmedia/api/v2/feedback {
    limit_req_status 429;
    if ($gm_api_allowed = 0) { return 404; }
    client_max_body_size 14m;
    limit_req zone=gm_feedback burst=3 nodelay;

    proxy_pass http://127.0.0.1:8700/v2/feedback;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-store" always;
    access_log /var/log/nginx/getmedia.access.log getmedia;
}

# ---- 接口：只放行免费路径白名单，其余 404 ------------------------------------------
# 去掉 /getmedia/api 前缀后转发；服务端路由是 /account/…、/v2/…、/health。
# 剥前缀用"带 URI 的 proxy_pass"，不用 rewrite：rewrite 阶段早于 limit_req，
# 一旦 rewrite 改了 $uri，http 级 $gm_auth_key 的正则（按原始路径匹配）就永远匹配不上，认证限流会静默失效。
# （由 tools/tests/test_deploy_nginx.py::test_auth_rate_limit 守护。）
# X-Forwarded-For 一律用 $remote_addr 覆盖（不信任客户端自填）。
location ^~ /getmedia/api/ {
    limit_req_status 429;
    if ($gm_api_allowed = 0) { return 404; }
    client_max_body_size 1m;
    limit_req zone=gm_api burst=40 nodelay;
    limit_req zone=gm_auth burst=10 nodelay;

    proxy_pass http://127.0.0.1:8700/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;

    add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-store" always;
    access_log /var/log/nginx/getmedia.access.log getmedia;
}

# ---- APK 备用直链（主下载走 GitHub Release）----------------------------------------
# 总带宽只有 10 Mbps：每 IP 1 个连接、全站同时 3 个、单连接约 300 KB/s。
location ^~ /getmedia/download/ {
    limit_conn_status 429;
    alias /var/www/getmedia/download/;
    autoindex off;
    try_files $uri =404;
    limit_conn gm_dl_ip 1;
    limit_conn gm_dl_all 3;
    limit_rate 300k;
    default_type application/octet-stream;
    types { application/vnd.android.package-archive apk; }

    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    access_log /var/log/nginx/getmedia.access.log getmedia;
}

# ---- 网页：带哈希的构建资源可长期缓存 ---------------------------------------------
location ^~ /getmedia/assets/ {
    alias /var/www/getmedia/public/assets/;
    try_files $uri =404;

    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    access_log /var/log/nginx/getmedia.access.log getmedia;
}

# ---- 网页：静态页面（web-public）--------------------------------------------------
# 前缀更长的 /getmedia/api/、/getmedia/assets/、/getmedia/download/ 优先匹配，互不冲突。
location ^~ /getmedia/ {
    alias /var/www/getmedia/public/;
    index index.html;
    try_files $uri $uri/ /getmedia/index.html;

    add_header Cache-Control "no-cache" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    access_log /var/log/nginx/getmedia.access.log getmedia;
}
