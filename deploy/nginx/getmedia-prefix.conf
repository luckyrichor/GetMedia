# GetMedia — /getmedia/ 前缀下的全部路由
# 安装位置：/etc/nginx/snippets/getmedia-prefix.conf
# 用法：在 443 的 server 块里、既有 include 之后加这一行（只此一行）：
#           include /etc/nginx/snippets/getmedia-prefix.conf;
# 回退：删除那一行并 reload（nginx -t 通过后），GetAudio、GetVideo 等其他项目不受影响。
#
# 依赖 getmedia-http.conf（http 级）里的 map / zone / log_format。
# 路径占位：
#   /var/www/getmedia/public/    网页静态文件（web-public 构建产物，放在仓库之外）
#   /var/www/getmedia/download/  APK 备用直链目录
#   /var/log/nginx/getmedia.access.log  专用访问日志（logrotate 见 deploy/logrotate/getmedia）
#   127.0.0.1:8700               getmedia-api（须与 GETMEDIA_BIND、getmedia-api.service 一致）
#
# 不开 CORS（同源）。add_header 不继承，所以安全头在每个 location 里各写一份。
#
# ---- 会话 Cookie 作用域 ------------------------------------------------------------
# 应用下发 / 清除会话时写的 path 由 GETMEDIA_COOKIE_PATH 决定，默认 /getmedia/（config.py 的
# cookie_path 默认值），两条通道（/getmedia/api/ 与 /getmedia/owner/）共用同一个作用域，
# 因此这里**不再做 proxy_cookie_path 改写**。以前那个改写是边缘补丁：代码默认值、两处 nginx、
# 测试断言三处必须永远同步，改一处忘一处就出怪问题（实测见 p6-deploy-plan.md §5.3.2）。

# ---- owner 接口：/getmedia/owner/api/ ------------------------------------------------
# 与免费白名单是两条独立通道：
#   /getmedia/api/        边缘按 $gm_api_allowed 白名单放行（只有免费路径），其余 404；
#   /getmedia/owner/api/  边缘用 auth_request 判断"是不是 owner"，通过后原样转发，路由由应用决定。
#
# 为什么不把 67 条 owner 路由也写进白名单：白名单会膨胀到 85 条正则，每加一条接口都要改 nginx
# 并重新 reload；auth_request 只回答"这个会话是不是 owner"，接口增减与边缘配置解耦。
# 应用侧仍然有 require_tier("owner") 二次校验——边缘把"没登录"和"不是 owner"都回成 404，
# 应用拦的是"越权"，两层都在，任何一层配置写错都不会直接暴露数据。
#
# 依赖：ngx_http_auth_request_module（Ubuntu 的 nginx 默认编译在内，安装前用
# `nginx -V 2>&1 | grep -- --with-http_auth_request_module` 确认）。

# 内部探测：复用 GET /v2/config/owner（匿名 401、free 403、owner 200），不新增接口。
# 子请求不带 body，只转发会话凭据；不写访问日志，避免每个媒体分片都留一行。
location = /_getmedia_owner_check {
    internal;
    # 子请求不读 body（下面 `proxy_pass_request_body off`），但 `client_max_body_size` 的
    # 检查发生在 location 匹配之后、与 body 是否被转发无关：本 location 不写就会继承
    # server 块里的 `client_max_body_size 1m`（同机其他项目的设置），于是**主请求**只要
    # 超过 1m 就被这个子请求判 413 —— 手机传本机导入的原件（几十上百 MB）必然失败，
    # nginx error.log 会写 `client intended to send too large body` + `auth request
    # unexpected status: 413`。这里必须显式放开，真正的上限由下面 owner location 决定。
    client_max_body_size 0;
    proxy_pass http://127.0.0.1:8700/v2/config/owner;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host $host;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-GetMedia-Session $http_x_getmedia_session;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_connect_timeout 3s;
    proxy_read_timeout 5s;
    access_log off;
}

location ^~ /getmedia/owner/api/ {
    # 匿名（探测返回 401）与 free（403）一律回 404：对外不可区分，也不暴露"这里有个 owner 通道"。
    # 登录入口统一在公开站 /getmedia/login；登录成功后由前端读 tier，owner 才引导进 /owner/。
    # 也就是说边缘不做任何"去登录"的跳转——跳转只会告诉扫描器"这个地址需要登录"。
    auth_request /_getmedia_owner_check;
    auth_request_set $gm_owner_status $upstream_status;
    error_page 401 403 = @gm_owner_hidden;

    limit_req_status 429;
    # 手机上传本机导入的原件走这里（`POST /v2/tracks/{id}/file`，边读边写临时文件）。
    # 单个文件的上限由这条决定：归档池共 5 GiB，给到 1 GiB 才不会让一部高清视频
    # 卡在 413 上（0.1.41 之前是 210m，只够放 200 MiB 以内的素材）。
    client_max_body_size 1024m;
    limit_req zone=gm_owner burst=20 nodelay;

    # 带 URI 的 proxy_pass：剥掉 /getmedia/owner/api/ 前缀，转发到应用的 /v2/…、/account/…
    proxy_pass http://127.0.0.1:8700/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    # 媒体流与 AI 产物是长连接，读超时给足；普通接口靠应用自己的超时兜底。
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    # 会话 Cookie 的作用域由应用自己写对（GETMEDIA_COOKIE_PATH，默认 /getmedia/），
    # 边缘不再改写 —— 见文件头「会话 Cookie 作用域」一段。

    add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-store" always;
    # 只回显"边缘判定通过"（到这里恒为 200），不含任何会话内容；被挡的请求走 @gm_owner_hidden，
    # 那边不带任何自定义头，404 与"文件不存在"完全一致。
    add_header X-GM-Owner $gm_owner_status always;
    access_log /var/log/nginx/getmedia.access.log getmedia;
}

# ---- owner 管理台静态页：/getmedia/owner/ ------------------------------------------
# 与 public 物理隔离：产物在 /var/www/getmedia/owner/，public 的 dist 里没有任何 owner 代码。
# 三种情况：
#   匿名或非 owner（401/403）→ 同样的 404，与"这个路径不存在"完全一致；
#   owner（200）→ 正常返回 index.html，未知子路径回退到 index.html（前端路由）。
# 注意：/getmedia/owner/api/ 的前缀更长，会先匹配上面的接口 location，不会被这里吞掉。
location ^~ /getmedia/owner/ {
    auth_request /_getmedia_owner_check;
    error_page 401 403 = @gm_owner_hidden;

    alias /var/www/getmedia/owner/;
    index index.html;
    try_files $uri $uri/ /getmedia/owner/index.html;

    add_header Cache-Control "no-cache" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    access_log /var/log/nginx/getmedia.access.log getmedia;
}

# 被挡下的请求统一走这里：404 与 nginx 自带的"文件不存在"没有任何区别（状态码、默认错误页都一致），
# 不回 JSON、不带 X-GM-Owner，避免把"401 还是 403"这个区别泄露出去。
location @gm_owner_hidden {
    return 404;
}

# ---- /getmedia → /getmedia/ ---------------------------------------------------------
location = /getmedia {
    return 308 /getmedia/;
}

# ---- 反馈接口：允许大请求体（图片），单独限流 -------------------------------------
# 精确匹配优先于下面的 ^~ 前缀匹配。方法与路径是否允许仍由 $gm_api_allowed 判定。
location = /getmedia/api/v2/feedback {
    limit_req_status 429;
    if ($gm_api_allowed = 0) { return 404; }
    client_max_body_size 14m;
    limit_req zone=gm_feedback burst=3 nodelay;

    proxy_pass http://127.0.0.1:8700/v2/feedback;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-store" always;
    access_log /var/log/nginx/getmedia.access.log getmedia;
}

# ---- 接口：只放行免费路径白名单，其余 404 ------------------------------------------
# 去掉 /getmedia/api 前缀后转发；服务端路由是 /account/…、/v2/…、/health。
# 剥前缀用"带 URI 的 proxy_pass"，不用 rewrite：rewrite 阶段早于 limit_req，
# 一旦 rewrite 改了 $uri，http 级 $gm_auth_key 的正则（按原始路径匹配）就永远匹配不上，认证限流会静默失效。
# （由 tools/tests/test_deploy_nginx.py::test_auth_rate_limit 守护。）
# X-Forwarded-For 一律用 $remote_addr 覆盖（不信任客户端自填）。
location ^~ /getmedia/api/ {
    limit_req_status 429;
    if ($gm_api_allowed = 0) { return 404; }
    client_max_body_size 1m;
    limit_req zone=gm_api burst=40 nodelay;
    limit_req zone=gm_auth burst=10 nodelay;

    proxy_pass http://127.0.0.1:8700/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;

    # 与 owner 通道一致：Cookie 作用域由应用写对，边缘不改写（见文件头注释）。

    add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-store" always;
    access_log /var/log/nginx/getmedia.access.log getmedia;
}

# ---- APK 备用直链（主下载走 GitHub Release）----------------------------------------
# 总带宽只有 10 Mbps：每 IP 1 个连接、全站同时 3 个、单连接约 300 KB/s。
location ^~ /getmedia/download/ {
    limit_conn_status 429;
    alias /var/www/getmedia/download/;
    autoindex off;
    try_files $uri =404;
    limit_conn gm_dl_ip 1;
    limit_conn gm_dl_all 3;
    limit_rate 300k;
    default_type application/octet-stream;
    types { application/vnd.android.package-archive apk; }

    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    access_log /var/log/nginx/getmedia.access.log getmedia;
}

# ---- 网页：带哈希的构建资源可长期缓存 ---------------------------------------------
location ^~ /getmedia/assets/ {
    alias /var/www/getmedia/public/assets/;
    try_files $uri =404;

    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    access_log /var/log/nginx/getmedia.access.log getmedia;
}

# ---- 网页：静态页面（web-public）--------------------------------------------------
# 前缀更长的 /getmedia/api/、/getmedia/assets/、/getmedia/download/ 优先匹配，互不冲突。
location ^~ /getmedia/ {
    alias /var/www/getmedia/public/;
    index index.html;
    try_files $uri $uri/ /getmedia/index.html;

    add_header Cache-Control "no-cache" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    access_log /var/log/nginx/getmedia.access.log getmedia;
}
