# 示意：443 的 server 块里"只加一行"的样子。
# 真实的 443 块由多个项目共用，GetMedia 不改动它，也不改动其他项目的 include 文件；
# 用户在既有 include 之后加入标注的那一行。证书、监听、其他项目的 include 都不属于 GetMedia。
# 本文件只是示意；真实的 nginx -t 与功能测试在 tools/tests/test_deploy_nginx.py（自己生成模拟 443 块）。
# 测试只检查：这里"GetMedia 的 include 恰好一行"，且不出现 GetMedia 以外的指令。

server {
    listen 443 ssl;
    server_name _;
    ssl_certificate     /etc/ssl/PLACEHOLDER/fullchain.pem;    # 已有，不属于 GetMedia
    ssl_certificate_key /etc/ssl/PLACEHOLDER/privkey.pem;      # 已有，不属于 GetMedia
    client_max_body_size 1m;

    include /etc/nginx/snippets/other-project-a.conf;          # 已有（示意）
    include /etc/nginx/snippets/other-project-b.conf;          # 已有（示意）

    include /etc/nginx/snippets/getmedia-prefix.conf;          # <—— GetMedia：只加这一行
}
